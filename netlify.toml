# The Hebrew copy of the app on Netlify. It's built on this computer with
# `npm run build:netlify` (Hebrew by default, same Firebase project) and
# uploaded as is, so Netlify doesn't run a build.
[build]
  publish = "dist-netlify"

# Single-page app: every path loads index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always be fresh so updates reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
